name: Build signed AAB (للنشر على Google Play)
# محتاج 4 Secrets في GitHub (Settings > Secrets):
#   KEYSTORE_BASE64 (ملف الـ keystore متحوّل base64) ، KEYSTORE_PASSWORD ، KEY_ALIAS ، KEY_PASSWORD
on:
  workflow_dispatch: {}
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: node scripts/patch-android.js
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: celyah-release-aab
          path: ${{ steps.sign.outputs.signedReleaseFile }}
